name: Gerar instalador Windows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'desktop/**'
      - 'scripts/prepare-desktop.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AM_TECH_APP_URL: https://am-tech-platform.onrender.com/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar aplicação
        run: npm test
      - name: Gerar instalador sem publicação automática
        run: npm run desktop:pack -- --publish never
      - name: Instalar e abrir em Windows isolado
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'AMTechInstalled'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Falha na instalação silenciosa' }
          $appExe = Join-Path $installDir 'AM Tech Platform.exe'
          if (!(Test-Path $appExe)) { throw 'Aplicativo instalado não encontrado' }
          $env:AM_TECH_SMOKE_TEST = '1'
          $env:AM_TECH_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 'desktop-smoke.json'
          $process = Start-Process -FilePath $appExe -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Tempo excedido na abertura do aplicativo' }
          if ($process.ExitCode -ne 0) { throw 'Aplicativo encerrou com erro' }
          if (!(Test-Path $env:AM_TECH_SMOKE_OUTPUT)) { throw 'Verificação de abertura não foi produzida' }
          $result = Get-Content $env:AM_TECH_SMOKE_OUTPUT -Raw | ConvertFrom-Json
          if (!$result.loaded -or !$result.packaged -or $result.nodeIntegration -or !$result.contextIsolation -or !$result.sandbox) { throw 'Verificação desktop inválida' }
          Copy-Item $env:AM_TECH_SMOKE_OUTPUT release/desktop-smoke.json
      - name: Gerar SHA256
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AM-Tech-Platform-Windows
          path: |
            release/*.exe
            release/*.exe.sha256
            release/desktop-smoke.json
          if-no-files-found: error
          retention-days: 30
